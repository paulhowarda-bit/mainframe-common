[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-parse"
version = "0.1.0"
description = "IBM Enterprise COBOL parse front-end: source -> Program AST (normalize, preprocess COPY/REPLACING, lex, parse, data division) with copybook provenance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paul Howard" }]
keywords = ["cobol", "mainframe", "parser", "ast", "copybook", "modernization"]

# Core only: the preprocessor reaches the estate's artifact service (decode_member,
# normalize_fetched) and stage-1 prefetch drives core's Prefetcher. The parse front-end
# must never depend on the modelling engine - the dependency points the other way.
dependencies = ["cobol-xstate-core>=0.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cobol-parse = "cobol_parse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
