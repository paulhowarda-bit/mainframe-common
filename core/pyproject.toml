[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-xstate-core"
version = "0.1.0"
description = "Shared estate-retrieval core for the cobol-xstate tools: the artifact-service boundary, two-stage dependency retrieval, and the replayable estate bundle."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paul Howard" }]
keywords = ["cobol", "jcl", "mainframe", "modernization", "estate", "retrieval"]

# Deliberately no dependencies, and deliberately no knowledge of its consumers. Core is
# what BOTH front-ends need to reach the estate the same way; if something here started
# importing cobol_xstate or jcl_dependencies, the dependency would point the wrong way
# and a JCL install would begin carrying a COBOL modelling engine it never executes.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
